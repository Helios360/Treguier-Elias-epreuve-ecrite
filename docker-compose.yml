# Stack de PRODUCTION — homeserver (symnodes.com)
# Variables attendues dans un fichier .env à la racine (voir .env.example).
services:

  # --- Reverse-proxy + TLS automatique (Let's Encrypt via Caddy) ---
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Montage du RÉPERTOIRE, pas du fichier : un bind mount de fichier unique reste
      # épinglé sur l'ancien inode quand `git` remplace le fichier (rename → nouvel
      # inode), et `caddy reload` relit alors une version périmée ("config is
      # unchanged"). Le montage de répertoire suit les remplacements de fichiers.
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
    networks:
      - proxy

  # --- Base de données (non exposée publiquement, données persistées) ---
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db
    networks:
      - app
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5

  # --- API principale ---
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DBNAME}?authSource=admin
      - JWT_SECRET=${JWT_SECRET}
      - GATEWAY_URL=http://gateway:8000
      - CORS_ORIGIN=${DOMAIN_URL}
      - NOTIFY_RECIPIENT=${NOTIFY_RECIPIENT}
      - SESSION_SECRET=${SESSION_SECRET}
      # Compte admin applicatif — consommé par seed-admin.js et seeder.js.
      # Sans ces lignes, les variables du .env n'atteignaient pas le conteneur et
      # le seed retombait silencieusement sur admin/admin1234.
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin1234}
    depends_on:
      mongo:
        condition: service_healthy
      gateway:
        condition: service_started
    networks:
      - app
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/products"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- Microservice notifications (email) ---
  notifications:
    build: ./microservices/notifications
    restart: unless-stopped
    environment:
      - NOTIFI_PORT=4002
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_APPLICATION_PASSWORD=${EMAIL_APPLICATION_PASSWORD}
    networks:
      - app

  # --- Microservice gestion du stock ---
  stock-management:
    build: ./microservices/stock-management
    restart: unless-stopped
    environment:
      - STOCK_PORT=4003
      - MONGO_URI=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DBNAME}?authSource=admin
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app

  # --- Gateway (point d'entrée des microservices) ---
  gateway:
    build: ./gateway
    restart: unless-stopped
    environment:
      - GATEWAY_PORT=8000
      - NOTIFI_SERVICE_URL=http://notifications:4002
      - STOCK_SERVICE_URL=http://stock-management:4003
    depends_on:
      - notifications
      - stock-management
    networks:
      - app

  # --- Frontend (React build servi par Nginx) ---
  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_API_BASE_URL=/api
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      app:
      proxy:
        aliases:
          - front-prod

volumes:
  mongo-data:
  caddy-data:

networks:
  proxy:
    name: traefik-proxy
  app:
    name: symnodes-app
