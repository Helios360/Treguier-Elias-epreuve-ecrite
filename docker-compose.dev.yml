# Stack de DÉVELOPPEMENT (local) — rechargement à chaud, ports exposés
#
# Lancement :
#   docker compose -f docker-compose.dev.yml up --build
# Frontend : http://localhost:3000  ·  API : http://localhost:5000/api
services:

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-dev-data:/data/db

  backend:
    build: ./backend
    command: node --watch server.js
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/mydatabase
      - JWT_SECRET=${JWT_SECRET:-dev-secret}
      - GATEWAY_URL=http://gateway:8000
      - CORS_ORIGIN=http://localhost:3000
      - NOTIFY_RECIPIENT=${NOTIFY_RECIPIENT:-dev@example.com}
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "5000:5000"
    depends_on:
      - mongo
      - gateway

  notifications:
    build: ./microservices/notifications
    command: node --watch index.js
    environment:
      - NOTIFI_PORT=4002
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_APPLICATION_PASSWORD=${EMAIL_APPLICATION_PASSWORD:-}
    volumes:
      - ./microservices/notifications:/app
      - /app/node_modules
    ports:
      - "4002:4002"

  stock-management:
    build: ./microservices/stock-management
    command: node --watch index.js
    environment:
      - STOCK_PORT=4003
    volumes:
      - ./microservices/stock-management:/app
      - /app/node_modules
    ports:
      - "4003:4003"

  gateway:
    build: ./gateway
    command: node --watch server.js
    environment:
      - GATEWAY_PORT=8000
      - NOTIFI_SERVICE_URL=http://notifications:4002
      - STOCK_SERVICE_URL=http://stock-management:4003
    volumes:
      - ./gateway:/app
      - /app/node_modules
    ports:
      - "8000:8000"
    depends_on:
      - notifications
      - stock-management

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm start"
    environment:
      - REACT_APP_API_BASE_URL=http://localhost:5000/api
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo-dev-data:
