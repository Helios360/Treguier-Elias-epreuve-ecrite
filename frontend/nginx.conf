server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interne de Docker : re-résolution continue des noms de services.
    # Sans cela, nginx résout `backend` une seule fois au démarrage et fige son IP :
    # recréer le conteneur backend (nouvelle IP) provoquait des 502 jusqu'au
    # redémarrage du frontend. La variable ci-dessous force la résolution à chaud.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream "http://backend:5000";

    # Application SPA : renvoyer index.html pour les routes côté client
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy des appels API vers le backend (même origine => pas de CORS)
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache long pour les assets statiques versionnés
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}
