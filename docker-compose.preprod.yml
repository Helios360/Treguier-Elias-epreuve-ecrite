# Stack de PRÉ-PRODUCTION — homeserver (preprod.symnodes.com)
#
# Partage le réseau proxy créé par la stack de prod (docker-compose.yml) : la
# stack de production doit donc tourner (ou au moins le réseau "traefik-proxy"
# doit exister) avant de lancer celle-ci.
#
# Lancement (projet distinct pour éviter les collisions de noms) :
#   docker compose -p symnodes-preprod -f docker-compose.preprod.yml up -d
services:

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo-preprod-data:/data/db
    networks:
      - app
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DBNAME}?authSource=admin
      - JWT_SECRET=${JWT_SECRET}
      - GATEWAY_URL=http://gateway:8000
      - CORS_ORIGIN=${PREDOMAIN_URL}
      - NOTIFY_RECIPIENT=${NOTIFY_RECIPIENT}
    depends_on:
      mongo:
        condition: service_healthy
      gateway:
        condition: service_started
    networks:
      - app

  notifications:
    build: ./microservices/notifications
    restart: unless-stopped
    environment:
      - NOTIFI_PORT=4002
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_APPLICATION_PASSWORD=${EMAIL_APPLICATION_PASSWORD}
    networks:
      - app

  stock-management:
    build: ./microservices/stock-management
    restart: unless-stopped
    environment:
      - STOCK_PORT=4003
    networks:
      - app

  gateway:
    build: ./gateway
    restart: unless-stopped
    environment:
      - GATEWAY_PORT=8000
      - NOTIFI_SERVICE_URL=http://notifications:4002
      - STOCK_SERVICE_URL=http://stock-management:4003
    depends_on:
      - notifications
      - stock-management
    networks:
      - app

  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_API_BASE_URL=/api
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.front-preprod.rule=Host(`preprod.${DOMAIN}`)"
      - "traefik.http.routers.front-preprod.entrypoints=websecure"
      - "traefik.http.routers.front-preprod.tls=true"
      - "traefik.http.routers.front-preprod.tls.certresolver=le"
      - "traefik.http.services.front-preprod.loadbalancer.server.port=80"

volumes:
  mongo-preprod-data:

networks:
  proxy:
    external: true
    name: traefik-proxy
  app:
