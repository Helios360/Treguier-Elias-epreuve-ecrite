# Stack de SUPERVISION (E26) — Prometheus + Grafana + Alertmanager + exporters.
#
# Se greffe sur le réseau applicatif de la prod (symnodes-app) pour scraper le backend.
# Les interfaces (Grafana/Prometheus/Alertmanager) sont liées à la boucle locale :
# on y accède depuis le serveur ou via le VPN / un tunnel SSH — jamais en public.
#
# Lancement : docker compose -f docker-compose.monitoring.yml up -d
services:

  prometheus:
    image: prom/prometheus:v2.55.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - monitoring
      - app

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --config.expand-env=true
    environment:
      - ALERT_EMAIL=${ALERT_EMAIL}
      - SMTP_SMARTHOST=${SMTP_SMARTHOST}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_APPLICATION_PASSWORD=${EMAIL_APPLICATION_PASSWORD}
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command: ['--path.rootfs=/host']
    pid: host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "127.0.0.1:9100:9100"
    networks:
      - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - monitoring

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - monitoring

volumes:
  prometheus-data:
  grafana-data:

networks:
  monitoring:
  app:
    external: true
    name: symnodes-app
