# Stack de SUPERVISION (E26) — Prometheus + Grafana + Alertmanager + exporters.
#
# À lancer avec un NOM DE PROJET DISTINCT (pour ne pas mélanger avec la prod) :
#   docker compose -p symnodes-monitoring -f docker-compose.monitoring.yml up -d
#
# - Aucun port hôte n'est exposé : tout passe par le réseau Docker.
#   Les interfaces publiques (Caddy) joignent les services par leur nom.
# - Se greffe sur symnodes-app (scrape du backend) et traefik-proxy (exposition Caddy).
# - node-exporter / cAdvisor / blackbox restent internes au réseau monitoring.
services:

  prometheus:
    image: prom/prometheus:v2.55.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Les consoles de l'image vivent dans /usr/share/prometheus : on les référence
      # en absolu car le montage de répertoire ci-dessous masque les liens
      # symboliques que l'image plaçait dans /etc/prometheus.
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.console.libraries=/usr/share/prometheus/console_libraries
    volumes:
      # Répertoire plutôt que fichiers individuels (cf. commentaire dans docker-compose.yml).
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    networks:
      - monitoring
      - app
      - proxy

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    environment:
      - ALERT_EMAIL=${ALERT_EMAIL}
      - SMTP_SMARTHOST=${SMTP_SMARTHOST}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_APPLICATION_PASSWORD=${EMAIL_APPLICATION_PASSWORD}
    volumes:
      # Répertoire plutôt que fichiers individuels (cf. commentaire dans docker-compose.yml).
      # Le script génère la config finale dans /alertmanager/ (répertoire inscriptible de l'image).
      - ./monitoring/alertmanager:/etc/alertmanager:ro
    networks:
      - monitoring
      - proxy

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command: ['--path.rootfs=/host']
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=https://grafana.${DOMAIN}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring
      - proxy

volumes:
  prometheus-data:
  grafana-data:

networks:
  monitoring:
  app:
    external: true
    name: symnodes-app
  proxy:
    external: true
    name: traefik-proxy
