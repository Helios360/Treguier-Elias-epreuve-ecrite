# Alertmanager — routage des alertes vers l'email (SMTP Gmail).
# Les variables ${...} sont développées par --config.expand-env=true.
route:
  receiver: email
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h

receivers:
  - name: email
    email_configs:
      - to: '${ALERT_EMAIL}'
        from: '${EMAIL_USER}'
        smarthost: '${SMTP_SMARTHOST}'
        auth_username: '${EMAIL_USER}'
        auth_password: '${EMAIL_APPLICATION_PASSWORD}'
        require_tls: true
        send_resolved: true
