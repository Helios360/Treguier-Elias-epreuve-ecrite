# Alertmanager — modèle de configuration.
# Les variables ${...} sont substituées AU DÉMARRAGE par monitoring/alertmanager/entrypoint.sh
# (Alertmanager n'expanse pas les variables d'environnement nativement).
route:
  receiver: email
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h

receivers:
  - name: email
    email_configs:
      - to: '${ALERT_EMAIL}'
        from: '${EMAIL_USER}'
        smarthost: '${SMTP_SMARTHOST}'
        auth_username: '${EMAIL_USER}'
        auth_password: '${EMAIL_APPLICATION_PASSWORD}'
        require_tls: true
        send_resolved: true
