global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Métriques applicatives (backend Express)
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:5000']

  # Métriques de l'hôte (CPU, RAM, disque, réseau)
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  # Métriques des conteneurs Docker
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  # Sondes HTTP externes (disponibilité des deux environnements)
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://symnodes.com
          - https://preprod.symnodes.com
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
